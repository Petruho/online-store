stages:
  - check

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

# Все проверки в том же Docker Compose, что и локально (make check)
check:
  stage: check
  image: docker:24-cli
  services:
    - name: docker:24-dind
      alias: docker
  timeout: 20m
  script:
    - cp .env.example .env

    # Тот же стек, что у разработчика
    - docker compose up -d --build
    - docker compose run --rm --no-deps app composer install --no-interaction --prefer-dist --no-progress
    - docker compose run --rm --no-deps frontend sh -c "npm ci"

    - docker compose exec -T app php artisan key:generate --force
    - docker compose exec -T app php artisan migrate --force

    # Те же команды, что make check / make test
    - docker compose exec -T app vendor/bin/phpcs
    - docker compose exec -T app vendor/bin/phpstan analyse --memory-limit=1G
    - docker compose exec -T app php artisan test
    - docker compose run --rm --no-deps frontend sh -c "npm run typecheck"
    - docker compose run --rm --no-deps frontend sh -c "npm run lint"
    - docker compose run --rm --no-deps frontend sh -c "npm run build"
  after_script:
    - docker compose down -v || true
