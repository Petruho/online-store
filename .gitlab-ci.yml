stages:
  - check

.php-setup: &php-setup
  - apt-get update -qq && apt-get install -y -qq git unzip libzip-dev libicu-dev libpq-dev libonig-dev
  - docker-php-ext-install pdo pdo_pgsql intl mbstring zip bcmath
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  - composer install --no-interaction --prefer-dist --no-progress

phpcs:
  stage: check
  image: php:8.4-cli
  before_script:
    - *php-setup
  script:
    - vendor/bin/phpcs

phpstan:
  stage: check
  image: php:8.4-cli
  before_script:
    - *php-setup
  script:
    - vendor/bin/phpstan analyse --memory-limit=1G

frontend:
  stage: check
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run typecheck
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - public/build/

pest:
  stage: check
  image: php:8.4-cli
  needs:
    - job: frontend
      artifacts: true
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: online_store_test
    POSTGRES_USER: online_store
    POSTGRES_PASSWORD: secret
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: online_store_test
    DB_USERNAME: online_store
    DB_PASSWORD: secret
    CACHE_STORE: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
    MAIL_MAILER: array
  before_script:
    - *php-setup
    - cp .env.example .env
    - php artisan key:generate
    - php artisan migrate --force
  script:
    - php artisan test
