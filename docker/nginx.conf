server {
    listen 80;
    # Корень — папка public, как у всех Laravel-проектов
    root /app/public;
    index index.php;

    location / {
        # Если файла нет — отдаём index.php (роутинг Laravel)
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Передаём выполнение PHP-файлов в контейнер app по FastCGI-протоколу
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
